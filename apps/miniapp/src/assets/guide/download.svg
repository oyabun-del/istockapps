<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" font-family="-apple-system, 'SF Pro Text', Inter, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="home" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#2d1b4a"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="300" height="340" rx="24" fill="url(#home)" stroke="#32353d" stroke-width="2"/>
  <text x="32" y="38" font-size="12" fill="#c3c6d7">Экран «Домой» на iPhone</text>

  <g fill="#fff" fill-opacity=".16">
    <rect x="38" y="54" width="48" height="48" rx="12"/>
    <rect x="102" y="54" width="48" height="48" rx="12"/>
    <rect x="166" y="54" width="48" height="48" rx="12"/>
    <rect x="230" y="54" width="48" height="48" rx="12"/>
  </g>

  <rect x="40" y="132" width="76" height="76" rx="19" fill="url(#app)" opacity=".35"/>
  <circle cx="78" cy="170" r="22" fill="#000" fill-opacity=".45"/>
  <circle cx="78" cy="170" r="16" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="4"/>
  <path d="M78 154a16 16 0 0 1 15.2 21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="78" y="228" text-anchor="middle" font-size="12" fill="#fff">Загрузка…</text>
  <rect x="34" y="126" width="88" height="88" rx="23" fill="none" stroke="#FACC15" stroke-width="2.5"/>
  <g transform="translate(122 126)"><circle r="11" fill="#FACC15" stroke="#1c1c1e" stroke-width="2"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1600">1</text></g>

  <path d="M140 170h36m-7-7 7 7-7 7" stroke="#c3c6d7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="200" y="132" width="76" height="76" rx="19" fill="url(#app)"/>
  <rect x="223" y="148" width="14" height="14" rx="4" fill="#fff"/>
  <rect x="223" y="167" width="14" height="24" rx="7" fill="#fff"/>
  <circle cx="272" cy="136" r="11" fill="#10b981" stroke="#1b2a4a" stroke-width="2"/>
  <path d="M267 136l3.5 3.5 6.5-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="238" y="228" text-anchor="middle" font-size="12" fill="#fff">Приложение</text>
  <g transform="translate(200 132)"><circle r="11" fill="#FACC15" stroke="#1c1c1e" stroke-width="2"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1600">2</text></g>

  <rect x="30" y="256" width="260" height="76" rx="14" fill="#000" fill-opacity=".35"/>
  <text x="160" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Дождитесь, пока значок</text>
  <text x="160" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">перестанет загружаться</text>
  <text x="160" y="321" text-anchor="middle" font-size="11" fill="#c3c6d7">Не открывайте приложение раньше времени</text>
